# ===== Cloudflare WAF Validation Framework — Zone Config =====
# Copy this file to zones/<zone>.yaml and fill in the values.
# Designed as a cutover standard: works for any zone/account, not one project.

zone:
  name: example.com
  zone_id: "your-zone-id"
  # Optional — auto-resolved from the zone API when omitted:
  # account_id: "your-account-id"

api:
  token_env: "CF_API_TOKEN"

targets:
  - hostname: www.example.com
    protocol: https
    test_paths:
      default: /
      api: /api/v1/health
  # Add every hostname class your WAF expressions mention (api/services/etc.):
  # - hostname: services-us-east-1.example.com
  #   protocol: https
  #   test_paths:
  #     default: /

# Map Cloudflare IP list names (without $) to an egress IP this runner uses.
# If omitted, the tool checks whether the runner's public IP is already a
# member of the list and auto-tests when it is.
test_ips:
  # my_whitelist: "203.0.113.10"
  # my_blocklist: "198.51.100.20"

options:
  request_timeout: 10
  rate_limit_buffer: 2
  rate_limit_max_auto: 600
  event_poll_delay: 30
  event_poll_retries: 6
  event_poll_interval: 10
  hybrid_graphql_fill: true
  # Host filter can drop events on some zones; Ray-ID match is enough.
  instant_logs_host_filter: false
  verify_ssl: true
  user_agent: "WAF-Validator/1.0"
  inter_request_delay: 0.25
  socks_proxy: null                # e.g. socks5h://127.0.0.1:9050 for geo/Tor (T1)

output:
  format: html                     # html | json | both
  directory: ./reports
  filename_template: "waf_validation_{zone}_{hostname}_{date}_{time}"
